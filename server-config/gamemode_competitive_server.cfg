// 服务器侧覆盖：本文件在 gamemode_competitive.cfg **之后**执行（引擎按这个顺序 exec），
// 所以能盖掉它设的值。原文件里 mp_warmuptime 是 300（5 分钟）——
// 大厅图阶段就是等这么久才进 BP，录视频/测试时太长，这里压到 10 秒。
//
// BP 阶段自己的计时不在这里（由地图的 Map veto pick controller 设：
// phase1=12s、phase2=25s…），所以改这个不会影响选图节奏。
mp_warmuptime 10
mp_warmuptime_all_players_connected 10

// 选边超时自动分配（默认 15 秒太慢，录视频想不用手点）
mp_force_pick_time 3

// 若上面的不够，这个把人类强制分到某队（any/ct/t）——
// （较早一版这里写的是 humans_join_team，实测这版本不存在；mp_force_assign_teams 是真实存在的）
mp_force_assign_teams 1
